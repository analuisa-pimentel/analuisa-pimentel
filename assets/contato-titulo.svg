<svg xmlns="http://www.w3.org/2000/svg" width="900" height="136" viewBox="0 0 900 136" role="img" aria-label="Contato" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Título da seção de contato. Os botões ficam em arquivos separados
     (contato-email.svg, contato-whatsapp.svg) porque cada um precisa do seu link. -->
