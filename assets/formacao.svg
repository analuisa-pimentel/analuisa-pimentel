<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Formação e certificações: Engenharia de Software na FIAP, conclusão em junho de 2030; AI Software Engineering 4.0 na Data Science Academy, em andamento; Inglês fluente, certificado C2 EF SET" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!--
  ============== FORMAÇÃO E CERTIFICAÇÕES: como editar ==============
  Cada item é um bloco <g class="item" transform="translate(48 Y)">.
  Linhas Y:  136 · 216 · 296 · 376 · 456 ...  (sempre +80)

  STATUS (texto pequeno à direita, com bolinha):
    class="status done"  → verde água   (concluído / certificado)
    class="status doing" → amarelo      (em andamento / previsão)

  ADICIONAR um item:
    1. copie um bloco inteiro e cole antes do </svg>
    2. Y = último Y + 80
    3. troque ícone, título, instituição e status
    4. aumente height e viewBox em 80 (400 vira 480 nas DUAS primeiras linhas)
  ==================================================================
-->
<style>
  .sans   { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
  .mono   { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace; }
  .bg     { fill: #0A2540; }
  .card   { fill: #0E3150; stroke: #1B4F75; stroke-width: 1.5; }
  .stroke { fill: none; stroke: #4FD1C5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .squig  { fill: none; stroke: #F5E3A1; stroke-width: 3; stroke-linecap: round; }
  .foam   { fill: #EAF6F6; }
  .mist   { fill: #9CC3CF; }
  .glyph  { fill: #4FD1C5; font-weight: 700; text-anchor: middle; }
  .title  { fill: #EAF6F6; font-size: 17px; font-weight: 600; }
  .sub    { fill: #9CC3CF; font-size: 14px; }
  .status { font-size: 13.5px; font-weight: 600; text-anchor: end; }
  .done   { fill: #4FD1C5; }
  .doing  { fill: #F5E3A1; }
</style>

<rect class="bg" width="900" height="400" rx="22"/>

<text class="sans foam" x="48" y="62" font-size="28" font-weight="700">Formação e certificações</text>
<path class="squig" d="M49 80 q 5 -6 10 0 t 10 0 t 10 0 t 10 0"/>
<text class="sans mist" x="48" y="110" font-size="15">Graduação, cursos e idiomas</text>

<!-- Engenharia de Software -->
<g class="item" transform="translate(48 136)">
  <rect class="card" width="804" height="64" rx="12"/>
  <circle class="bg" cx="36" cy="32" r="20"/>
  <g transform="translate(36 32)">
    <path class="stroke" d="M-11 -2 L0 -8 L11 -2 L0 4 Z"/>
    <path class="stroke" d="M-6 1 V6 C -3 9 3 9 6 6 V1"/>
  </g>
  <text class="sans title" x="72" y="28">Engenharia de Software</text>
  <text class="sans sub"   x="72" y="49">FIAP, bacharelado</text>
  <text class="sans status doing" x="766" y="37">Conclusão em jun/2030</text>
  <circle class="doing" cx="780" cy="32" r="4.5"/>
</g>

<!-- AI Software Engineering -->
<g class="item" transform="translate(48 216)">
  <rect class="card" width="804" height="64" rx="12"/>
  <circle class="bg" cx="36" cy="32" r="20"/>
  <text class="mono glyph" x="36" y="38" font-size="15">AI</text>
  <text class="sans title" x="72" y="28">AI Software Engineering 4.0</text>
  <text class="sans sub"   x="72" y="49">Data Science Academy</text>
  <text class="sans status doing" x="766" y="37">Em andamento</text>
  <circle class="doing" cx="780" cy="32" r="4.5"/>
</g>

<!-- Inglês -->
<g class="item" transform="translate(48 296)">
  <rect class="card" width="804" height="64" rx="12"/>
  <circle class="bg" cx="36" cy="32" r="20"/>
  <text class="mono glyph" x="36" y="38" font-size="15">EN</text>
  <text class="sans title" x="72" y="28">Inglês fluente</text>
  <text class="sans sub"   x="72" y="49">EF SET, nível C2</text>
  <text class="sans status done" x="766" y="37">Certificado</text>
  <circle class="done" cx="780" cy="32" r="4.5"/>
</g>
</svg>
