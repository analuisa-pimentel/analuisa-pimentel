<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" role="img" aria-label="Stack: Python, APIs REST, HTML, CSS, JavaScript, Responsividade, Git e GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!--
  ===================== STACK: como editar =====================
  Cada tecnologia é um bloco <g class="item" transform="translate(X Y)">.

  Posições da grade (4 por linha):
     colunas X:  48 · 254 · 460 · 666
     linhas  Y:  136 · 272 · 408 · 544 ...

  ADICIONAR uma tecnologia:
    1. copie um bloco inteiro (do <g class="item"> até o </g> dele)
    2. troque o X/Y para a próxima posição livre
    3. troque o ícone (o <g> do meio) e o nome (último <text>)
    4. se abriu uma linha nova, aumente height e viewBox em 136
       (ex.: 432 vira 568 nas DUAS primeiras linhas deste arquivo)
  ==============================================================
-->
<style>
  .sans   { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
  .mono   { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace; }
  .bg     { fill: #0A2540; }
  .card   { fill: #0E3150; stroke: #1B4F75; stroke-width: 1.5; }
  .aqua   { fill: #4FD1C5; }
  .stroke { fill: none; stroke: #4FD1C5; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .squig  { fill: none; stroke: #F5E3A1; stroke-width: 3; stroke-linecap: round; }
  .foam   { fill: #EAF6F6; }
  .mist   { fill: #9CC3CF; }
  .glyph  { fill: #4FD1C5; font-weight: 700; text-anchor: middle; }
  .label  { fill: #EAF6F6; font-size: 15px; text-anchor: middle; }
</style>

<defs>
  <!-- moldura padrão do card + círculo do ícone -->
  <g id="base">
    <rect class="card" width="186" height="116" rx="14"/>
    <circle class="bg" cx="93" cy="46" r="26"/>
  </g>
</defs>

<rect class="bg" width="900" height="432" rx="22"/>

<text class="sans foam" x="48" y="62" font-size="28" font-weight="700">Stack</text>
<path class="squig" d="M49 80 q 5 -6 10 0 t 10 0 t 10 0 t 10 0"/>
<text class="sans mist" x="48" y="110" font-size="15">Linguagens e ferramentas que uso nos meus projetos</text>

<!-- Python -->
<g class="item" transform="translate(48 136)">
  <use href="#base"/>
  <text class="mono glyph" x="93" y="53" font-size="19">py</text>
  <text class="sans label" x="93" y="98">Python</text>
</g>

<!-- APIs REST -->
<g class="item" transform="translate(254 136)">
  <use href="#base"/>
  <g transform="translate(93 46)">
    <path class="stroke" d="M-11 -5 H11 M6 -10 L11 -5 L6 0"/>
    <path class="stroke" d="M11 5 H-11 M-6 0 L-11 5 L-6 10"/>
  </g>
  <text class="sans label" x="93" y="98">APIs REST</text>
</g>

<!-- HTML -->
<g class="item" transform="translate(460 136)">
  <use href="#base"/>
  <text class="mono glyph" x="93" y="52" font-size="17">&lt;/&gt;</text>
  <text class="sans label" x="93" y="98">HTML</text>
</g>

<!-- CSS -->
<g class="item" transform="translate(666 136)">
  <use href="#base"/>
  <text class="mono glyph" x="93" y="52" font-size="18">{ }</text>
  <text class="sans label" x="93" y="98">CSS</text>
</g>

<!-- JavaScript -->
<g class="item" transform="translate(48 272)">
  <use href="#base"/>
  <text class="mono glyph" x="93" y="53" font-size="19">js</text>
  <text class="sans label" x="93" y="98">JavaScript</text>
</g>

<!-- Responsividade -->
<g class="item" transform="translate(254 272)">
  <use href="#base"/>
  <g transform="translate(93 46)">
    <rect class="stroke" x="-13" y="-10" width="20" height="14" rx="2"/>
    <path class="stroke" d="M-7 9 H1"/>
    <rect class="stroke" x="5" y="-4" width="9" height="15" rx="2"/>
  </g>
  <text class="sans label" x="93" y="98">Responsividade</text>
</g>

<!-- Git -->
<g class="item" transform="translate(460 272)">
  <use href="#base"/>
  <g transform="translate(93 46)">
    <path class="stroke" d="M-6 -9 V9 M-6 1 C -6 -4 7 -2 7 -7"/>
    <circle class="aqua" cx="-6" cy="-10" r="3.2"/>
    <circle class="aqua" cx="-6" cy="10" r="3.2"/>
    <circle class="aqua" cx="7" cy="-8" r="3.2"/>
  </g>
  <text class="sans label" x="93" y="98">Git</text>
</g>

<!-- GitHub -->
<g class="item" transform="translate(666 272)">
  <use href="#base"/>
  <g transform="translate(93 46)">
    <path class="stroke" d="M-10 -12 H8 a2 2 0 0 1 2 2 V12 H-8 a2 2 0 0 1 -2 -2 Z"/>
    <path class="stroke" d="M-10 6 a2 2 0 0 1 2 -2 H10"/>
    <path class="stroke" d="M-4 -6 H4"/>
  </g>
  <text class="sans label" x="93" y="98">GitHub</text>
</g>
</svg>
