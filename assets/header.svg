<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="Ana Luisa Pimentel, desenvolvedora back-end">
<!--
  ===================== HEADER: como editar =====================
  NOME ......... procure por  [NOME]
  CARGO ........ procure por  [CARGO]
  BIO .......... procure por  [BIO]  (cada <tspan> é uma linha;
                 SVG não quebra linha sozinho, então mantenha
                 cada linha com até ~55 caracteres)
  TERMINAL ..... procure por  [TERMINAL]
  CORES ........ estão todas no bloco <style> logo abaixo
  ===============================================================
-->
<style>
  .sans  { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
  .mono  { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace; }

  /* paleta */
  .bg     { fill: #0A2540; }  /* azul do mar profundo  */
  .card   { fill: #0E3150; }  /* azul do mar médio     */
  .line   { stroke: #1B4F75; }
  .sea    { fill: #1E6F9F; }  /* azul do mar claro     */
  .aqua   { fill: #4FD1C5; }  /* verde água            */
  .butter { fill: #F5E3A1; }  /* amarelo manteiga      */
  .foam   { fill: #EAF6F6; }  /* texto principal       */
  .mist   { fill: #9CC3CF; }  /* texto secundário      */

  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
  @keyframes blink { 50% { opacity: 0; } }
  .wave-a { animation: drift 16s linear infinite; }
  .wave-b { animation: drift 26s linear infinite; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    .wave-a, .wave-b, .cursor { animation: none; }
  }
</style>

<defs>
  <clipPath id="frame"><rect width="900" height="450" rx="22"/></clipPath>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#F5E3A1" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#F5E3A1" stop-opacity="0"/>
  </radialGradient>
</defs>

<g clip-path="url(#frame)">
  <rect class="bg" width="900" height="450"/>

  <!-- sol amarelo manteiga atrás do terminal -->
  <circle cx="846" cy="66" r="90" fill="url(#glow)"/>
  <circle class="butter" cx="846" cy="66" r="24"/>

  <!-- ondas -->
  <path class="sea wave-a" opacity="0.35" d="M0 394 q 112.5 -12 225 0 t 225 0 t 225 0 t 225 0 t 225 0 t 225 0 t 225 0 t 225 0 V 450 H 0 Z"/>
  <path class="aqua wave-b" opacity="0.16" d="M0 414 q 56.25 -7 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 t 112.5 0 V 450 H 0 Z"/>

  <!-- [NOME] / [CARGO] / [BIO] -->
  <text class="sans mist" x="48" y="64" font-size="16">Olá, eu sou a</text>
  <text class="sans foam" x="44" font-size="66" font-weight="800" letter-spacing="-1.5">
    <tspan x="44" y="126">Ana Luisa</tspan>
    <tspan x="44" y="192">Pimentel</tspan>
  </text>
  <text class="sans aqua" x="48" y="232" font-size="21" font-weight="600">Desenvolvedora back-end</text>

  <text class="sans mist" x="48" y="270" font-size="15">
    <tspan x="48" dy="0">Estudo Engenharia de Software na FIAP e faço cursos</tspan>
    <tspan x="48" dy="23">complementares na área. Gosto de construir integrações</tspan>
    <tspan x="48" dy="23">com IA, APIs bem estruturadas e interfaces claras, com</tspan>
    <tspan x="48" dy="23">base em front-end para enxergar o produto de ponta a</tspan>
    <tspan x="48" dy="23">ponta. Aberta a oportunidades na área.</tspan>
  </text>

  <!-- [TERMINAL] -->
  <g transform="translate(540 108)">
    <rect class="card line" width="292" height="176" rx="14" stroke-width="1.5"/>
    <path class="line" d="M0 34 H292" stroke-width="1.5"/>
    <circle class="butter" cx="20" cy="17" r="5"/>
    <circle class="aqua"   cx="38" cy="17" r="5"/>
    <circle class="sea"    cx="56" cy="17" r="5"/>

    <text class="mono" font-size="13.5" x="20" y="62">
      <tspan class="mist">$ </tspan><tspan class="foam">GET /ana-luisa</tspan>
    </text>
    <text class="mono mist" font-size="13.5" x="20" y="86">{</text>
    <text class="mono" font-size="13.5" x="38" y="106">
      <tspan class="aqua">"foco"</tspan><tspan class="mist">: </tspan><tspan class="butter">"back-end"</tspan><tspan class="mist">,</tspan>
    </text>
    <text class="mono" font-size="13.5" x="38" y="126">
      <tspan class="aqua">"curte"</tspan><tspan class="mist">: [</tspan><tspan class="butter">"IA"</tspan><tspan class="mist">, </tspan><tspan class="butter">"APIs"</tspan><tspan class="mist">]</tspan>
    </text>
    <text class="mono mist" font-size="13.5" x="20" y="146">}</text>
    <rect class="aqua cursor" x="34" y="135" width="8" height="15" rx="1"/>
  </g>
</g>
</svg>
